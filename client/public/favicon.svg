<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Subtle outer ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <!-- North needle — bold white -->
  <polygon points="16,5 20,15 16,13 12,15" fill="white"/>
  <!-- South needle — dimmer white -->
  <polygon points="16,27 20,17 16,19 12,17" fill="rgba(255,255,255,0.3)"/>
  <!-- Center dot (white ring + indigo core for depth) -->
  <circle cx="16" cy="16" r="2.5" fill="white"/>
  <circle cx="16" cy="16" r="1.2" fill="#4F46E5"/>
</svg>
